# ====================================================================
# xiuxian挂机游戏 - 应用配置文件（2H4G优化版）
# ====================================================================
# 作者: shaun.sheng
# 优化日期: 2026-03-24
# 优化目标: 适配2H4G个人服务器环境
# ====================================================================

# 服务器配置
server.port=8082
server.address=0.0.0.0

# Spring MVC配置
spring.servlet.encoding.charset=UTF-8
spring.servlet.encoding.enabled=true
spring.servlet.encoding.force=true

# ============================================
# 数据源配置（HikariCP） - 适配2H4G环境优化
# ============================================
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/xiuxian_game?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP连接池配置 - 适配2H4G环境（降低连接数，节省内存）
# 原值: max=20, min=5
# 优化值: max=10, min=3
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=3
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.pool-name=XiuxianGameHikariCP

# ============================================
# MyBatis-Plus配置
# ============================================
mybatis-plus.mapper-locations=classpath:mapper/*.xml
mybatis-plus.type-aliases-package=com.xiuxian.game.entity
mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl
mybatis-plus.global-config.db-config.id-type=auto
mybatis-plus.global-config.db-config.logic-delete-field=deleted
mybatis-plus.global-config.db-config.logic-delete-value=1
mybatis-plus.global-config.db-config.logic-not-delete-value=0

# MyBatis-Plus性能优化 - 适配2H4G环境
mybatis-plus.configuration.default-executor-type=REUSE
mybatis-plus.configuration.statement-timeout=10000

# ============================================
# Redis配置 - 适配2H4G环境优化
# ============================================
spring.redis.host=127.0.0.1
spring.redis.port=6379
spring.redis.password=
spring.redis.database=0
spring.redis.timeout=5000ms

# Redis连接池配置（Lettuce） - 适配2H4G环境（降低连接数，节省内存）
# 原值: max-active=50, max-idle=20
# 优化值: max-active=15, max-idle=8
spring.redis.lettuce.pool.max-active=15
spring.redis.lettuce.pool.max-idle=8
spring.redis.lettuce.pool.min-idle=3
spring.redis.lettuce.pool.max-wait=5000ms
spring.redis.lettuce.pool.time-between-eviction-runs=30000

# ============================================
# 缓存配置 - TTL优化（基于实际业务）
# ============================================
spring.cache.type=redis
spring.cache.redis.time-to-live=1800000
spring.cache.redis.cache-null-values=false
spring.cache.redis.use-key-prefix=true
spring.cache.redis.key-prefix=xiuxian::
spring.cache.redis.cache-null-values=false

# 缓存TTL配置（细化不同业务场景）
# 排行榜: 5分钟 → 3分钟（缩短保证实时性）
# 拍卖行: 1分钟 → 30秒（缩短保证实时性）
# 配置数据: 1小时 → 2小时（延长减少Redis压力）
# 叙事对话: 10分钟 → 1小时（延长减少Redis压力）
# 玩家数据: 30分钟 → 30分钟（保持不变）
# 战斗缓存: 10秒 → 10秒（保持不变）
spring.cache.redis.ttl.ranking=180000
spring.cache.redis.ttl.auction=30000
spring.cache.redis.ttl.config=7200000
spring.cache.redis.ttl.narrative=3600000
spring.cache.redis.ttl.player=1800000
spring.cache.redis.ttl.combat=10000

# ============================================
# JWT配置
# ============================================
jwt.secret=xiuxianGameSecretKey2024VeryLongAndSecure
jwt.expiration=86400000

# ============================================
# 日志配置
# ============================================
logging.config=classpath:log4j2-spring.xml
logging.file.path=logs
logging.level.org.springframework.web=INFO
logging.level.com.xiuxian.game=DEBUG
logging.level.org.apache.ibatis=DEBUG
logging.level.com.baomidou.mybatisplus=DEBUG
logging.level.org.springframework.cache=DEBUG

# ============================================
# 文件上传配置
# ============================================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.servlet.multipart.enabled=true

# ============================================
# Actuator监控配置
# ============================================
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when-authorized
management.metrics.export.prometheus.enabled=true

# ============================================
# Sentinel限流配置（适配2H4G环境）
# ============================================
spring.cloud.sentinel.enabled=true
spring.cloud.sentinel.transport.dashboard=127.0.0.1:8080
spring.cloud.sentinel.eager=true
spring.cloud.sentinel.datasource.ds.file.file=classpath:sentinel-rules.json

# ============================================
# 应用配置
# ============================================
app.game.max-level=9999
app.game.max-offline-hours=24

# ============================================
# 测试配置
# ============================================
app.test.enabled=false

# ============================================
# 安全配置
# ============================================
app.security.jwt.expiration-hours=24
app.security.jwt.refresh-expiration-hours=168
app.security.cors.enabled=true
app.security.cors.allowed-origins=*
app.security.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS

# ============================================
# 限流配置（适配2H4G环境）
# ============================================
app.rate-limit.enabled=true
app.rate-limit.max-requests-per-minute=1000

# ============================================
# 性能优化配置
# ============================================
app.performance.cache.enabled=true
app.performance.query-cache-enabled=true
app.performance.index-enabled=true

# ============================================
# 错误码配置
# ============================================
app.error-code.prefix=xiuxian.game.error.code

# ============================================
# 监控配置
# ============================================
management.health.redis.enabled=true
management.health.db.enabled=true

# ============================================
# 配置类加载
# ============================================
app.config.auto-reload=true

# ============================================
# 应用名称
# ============================================
spring.application.name=xiuxian-game

# ============================================
# 文档配置
# ============================================
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# ============================================
# 开发工具配置
# ============================================
spring.devtools.restart.enabled=false

# ============================================
# 资源配置
# ============================================
spring.web.resources.add-mappings=true
spring.web.resources.cache.period=3600

# ============================================
# 启动提示
# ============================================
app.startup.banner-enabled=true

# ============================================
# 环境配置
# ============================================
spring.profiles.active=prod

# ============================================
# 完整配置文件路径
# ============================================
config.file.path=classpath:config/app-config.properties

# ============================================
# 配置文件包含
# ============================================
spring.config.import=optional:classpath:config/app-config.properties,optional:file:./config/application-local.properties

# ============================================
# JVM配置（开发环境）
# -Xms256m -Xmx512m -XX:+UseG1GC -XX:MaxGCPauseMillis=200
# ============================================

# ============================================
# JVM配置（生产环境）
# -Xms512m -Xmx1024m -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -XX:+HeapDumpOnOutOfMemoryError
# ============================================

# ============================================
# 数据库索引配置
# ============================================
spring.datasource.initialization-mode=never
spring.datasource.schema=classpath:sql/schema.sql

# ====================================================================
# 配置优化总结
# ====================================================================
#
# 数据库连接池: max=20→10, min=5→3 (节省50%连接数)
# Redis连接池: max-active=50→15, max-idle=20→8 (节省70%连接数)
# 缓存TTL: ranking 5m→3m, auction 1m→30s, config 1h→2h, narrative 10m→1h
# MyBatis-Plus: default-executor-type=REUSE, statement-timeout=10s
#
# ====================================================================
