<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>xiuxian - login - 水墨风格</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" type="image/svg+xml" href="images/favicon.svg">
    
    <!-- 配置Tailwind自定义颜色和字体 -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#8B4513',
                        secondary: '#2F4F4F',
                        accent: '#CD5C5C',
                        light: '#F5F5DC',
                        dark: '#2C3E50',
                    },
                    fontFamily: {
                        ancient: ['"Ma Shan Zheng"', '"Noto Serif SC"', 'serif'],
                    }
                }
            }
        }
    </script>
</head>
<body>
    <div id="loginPage" class="container active">
        <div class="login-form">
            <h1 class="text-shadow"><i class="fa-solid fa-wand-magic-sparkles"></i> xiuxian挂机游戏</h1>
            <p class="text-secondary italic mb-6">大道争锋,始于足下</p>
            <div class="tabs">
                <button class="tab-btn active" onclick="showLogin()">登录</button>
                <button class="tab-btn" onclick="showRegister()">注册</button>
            </div>
            <div id="loginForm" class="form-content">
                <div class="input-group">
                    <i class="fa-solid fa-user"></i>
                    <input type="text" id="loginUsername" placeholder="用户名" required>
                </div>
                <div class="input-group">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="loginPassword" placeholder="密码" required>
                </div>
                <button class="btn btn-primary" onclick="login(event)"><i class="fa-solid fa-right-to-bracket"></i> 登录</button>
                
                <!-- 管理员登录链接 -->
                <div class="text-center mt-4">
                    <a href="adminLogin.html" class="text-sm text-secondary hover:text-accent transition-colors">
                        <i class="fas fa-shield-alt mr-1"></i>
                        管理员登录
                    </a>
                </div>
            </div>
            <div id="registerForm" class="form-content" style="display: none;">
                <div class="input-group">
                    <i class="fa-solid fa-user"></i>
                    <input type="text" id="registerUsername" placeholder="用户名" required>
                </div>
                <div class="input-group">
                    <i class="fa-solid fa-user"></i>
                    <input type="text" id="registerNickname" placeholder="昵称" required>
                </div>
                <div class="input-group">
                    <i class="fa-solid fa-envelope"></i>
                    <input type="email" id="registerEmail" placeholder="邮箱" required>
                </div>
                <div class="input-group">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="registerPassword" placeholder="密码" required>
                </div>
                <div class="input-group">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="registerConfirmPassword" placeholder="确认密码" required>
                </div>
                <button class="btn btn-primary" onclick="register(event)"><i class="fa-solid fa-user-plus"></i> 注册</button>
            </div>
        </div>
    </div>
    <div id="loading" class="loading hidden"><div class="spinner"></div><span>加载中...</span></div>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
