<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>xiuxian - login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/modern-style.css">
    <link rel="icon" type="image/svg+xml" href="images/favicon.svg">
</head>
<body>
    <div id="loginPage" class="container active">
        <div class="login-form">
            <h1><i class="fa-solid fa-wand-magic-sparkles"></i> xiuxian挂机</h1>
            <p>大道争锋,始于足下</p>
            <div class="tabs">
                <button class="tab-btn active" onclick="if(window.authManagerInstance) window.authManagerInstance.showLoginForm()">登录</button>
                <button class="tab-btn" onclick="if(window.authManagerInstance) window.authManagerInstance.showRegisterForm()">注册</button>
            </div>
            <div id="loginForm" class="form-content" style="display: block;">
                <div class="input-group">
                    <i class="fa-solid fa-user"></i>
                    <input type="text" id="loginUsername" placeholder="用户名" required>
                </div>
                <div class="input-group">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="loginPassword" placeholder="密码" required>
                </div>
                <button class="btn btn-primary" id="loginBtn"><i class="fa-solid fa-right-to-bracket"></i> 登录</button>
                
                <!-- 管理员登录链接 -->
                <div class="text-center mt-4">
                    <a href="adminLogin.html" class="text-sm text-secondary hover:text-accent transition-colors">
                        <i class="fas fa-shield-alt mr-1"></i>
                        管理员登录
                    </a>
                </div>
            </div>
            <div id="registerForm" class="form-content" style="display: none;">
                <div class="input-group">
                    <i class="fa-solid fa-user"></i>
                    <input type="text" id="registerUsername" placeholder="用户名" required>
                </div>
                <div class="input-group">
                    <i class="fa-solid fa-user"></i>
                    <input type="text" id="registerNickname" placeholder="昵称" required>
                </div>
                <div class="input-group">
                    <i class="fa-solid fa-envelope"></i>
                    <input type="email" id="registerEmail" placeholder="邮箱" required>
                </div>
                <div class="input-group">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="registerPassword" placeholder="密码" required>
                </div>
                <div class="input-group">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="registerConfirmPassword" placeholder="确认密码" required>
                </div>
                <button class="btn-primary" id="registerBtn"><i class="fa-solid fa-user-plus"></i> 注册</button>
            </div>
        </div>
    </div>
    <div id="loading" class="loading hidden"><div class="spinner"></div><span>加载中...</span></div>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script>
        // 绑定登录和注册按钮事件
        document.addEventListener('DOMContentLoaded', function() {
            const loginBtn = document.getElementById('loginBtn');
            const registerBtn = document.getElementById('registerBtn');
            
            if (loginBtn && window.authManagerInstance) {
                loginBtn.addEventListener('click', function() {
                    window.authManagerInstance.login();
                });
            }
            
            if (registerBtn && window.authManagerInstance) {
                registerBtn.addEventListener('click', function() {
                    window.authManagerInstance.register();
                });
            }
        });
    </script>
</body>
</html>
