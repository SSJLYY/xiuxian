<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>配置管理 - xiuxian挂机游戏</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-gray-100">
    <div class="container mx-auto px-4 py-8">
        <div class="bg-white rounded-lg shadow-md p-6">
            <div class="flex justify-between items-center mb-6">
                <h1 class="text-2xl font-bold text-gray-800">游戏配置管理</h1>
                <div class="flex space-x-2">
                    <button id="refreshCacheBtn" class="bg-blue-500 text-white px-4 py-2 rounded-md hover:bg-blue-600 focus:outline-none focus:ring-2 focus:ring-blue-500">
                        刷新缓存
                    </button>
                    <button id="addConfigBtn" class="bg-green-500 text-white px-4 py-2 rounded-md hover:bg-green-600 focus:outline-none focus:ring-2 focus:ring-green-500">
                        添加配置
                    </button>
                </div>
            </div>
            
            <!-- 快捷操作 -->
            <div class="bg-gray-50 p-4 rounded-lg mb-6">
                <h3 class="text-lg font-medium text-gray-800 mb-4">快捷操作</h3>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div class="bg-white p-4 rounded-lg border">
                        <h4 class="font-medium text-gray-800 mb-2">双倍经验活动</h4>
                        <div class="flex items-center space-x-2">
                            <span id="doubleExpStatus" class="text-sm text-gray-600">状态: 关闭</span>
                            <button id="toggleDoubleExpBtn" class="bg-yellow-500 text-white px-3 py-1 rounded text-sm hover:bg-yellow-600">
                                切换
                            </button>
                        </div>
                    </div>
                    <div class="bg-white p-4 rounded-lg border">
                        <h4 class="font-medium text-gray-800 mb-2">双倍掉落活动</h4>
                        <div class="flex items-center space-x-2">
                            <span id="doubleDropStatus" class="text-sm text-gray-600">状态: 关闭</span>
                            <button id="toggleDoubleDropBtn" class="bg-yellow-500 text-white px-3 py-1 rounded text-sm hover:bg-yellow-600">
                                切换
                            </button>
                        </div>
                    </div>
                    <div class="bg-white p-4 rounded-lg border">
                        <h4 class="font-medium text-gray-800 mb-2">维护模式</h4>
                        <div class="flex items-center space-x-2">
                            <span id="maintenanceStatus" class="text-sm text-gray-600">状态: 关闭</span>
                            <button id="toggleMaintenanceBtn" class="bg-red-500 text-white px-3 py-1 rounded text-sm hover:bg-red-600">
                                切换
                            </button>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- 分类筛选 -->
            <div class="mb-6">
                <div class="flex flex-wrap gap-2">
                    <button class="category-filter active bg-blue-500 text-white px-3 py-1 rounded text-sm hover:bg-blue-600" data-category="ALL">
                        全部
                    </button>
                    <button class="category-filter bg-gray-200 text-gray-700 px-3 py-1 rounded text-sm hover:bg-gray-300" data-category="EXPERIENCE">
                        经验
                    </button>
                    <button class="category-filter bg-gray-200 text-gray-700 px-3 py-1 rounded text-sm hover:bg-gray-300" data-category="DROP">
                        掉落
                    </button>
                    <button class="category-filter bg-gray-200 text-gray-700 px-3 py-1 rounded text-sm hover:bg-gray-300" data-category="SHOP">
                        商店
                    </button>
                    <button class="category-filter bg-gray-200 text-gray-700 px-3 py-1 rounded text-sm hover:bg-gray-300" data-category="REALM">
                        境界
                    </button>
                    <button class="category-filter bg-gray-200 text-gray-700 px-3 py-1 rounded text-sm hover:bg-gray-300" data-category="PET">
                        宠物
                    </button>
                    <button class="category-filter bg-gray-200 text-gray-700 px-3 py-1 rounded text-sm hover:bg-gray-300" data-category="ACTIVITY">
                        活动
                    </button>
                    <button class="category-filter bg-gray-200 text-gray-700 px-3 py-1 rounded text-sm hover:bg-gray-300" data-category="SYSTEM">
                        系统
                    </button>
                </div>
            </div>
            
            <!-- 配置表格 -->
            <div class="overflow-x-auto">
                <table class="min-w-full bg-white border border-gray-200">
                    <thead class="bg-gray-50">
                        <tr>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">配置键</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">配置值</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">类型</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">分类</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">描述</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">更新时间</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">操作</th>
                        </tr>
                    </thead>
                    <tbody id="configTableBody" class="bg-white divide-y divide-gray-200">
                        <!-- 动态加载 -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    
    <!-- 添加/编辑配置模态框 -->
    <div id="configModal" class="fixed inset-0 bg-gray-600 bg-opacity-50 hidden">
        <div class="flex items-center justify-center min-h-screen">
            <div class="bg-white rounded-lg shadow-lg max-w-md w-full mx-4">
                <div class="px-6 py-4 border-b border-gray-200">
                    <h3 id="modalTitle" class="text-lg font-medium text-gray-900">添加配置</h3>
                </div>
                <div class="px-6 py-4">
                    <form id="configForm">
                        <div class="mb-4">
                            <label class="block text-sm font-medium text-gray-700 mb-1">配置键</label>
                            <input type="text" id="configKey" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" required>
                        </div>
                        <div class="mb-4">
                            <label class="block text-sm font-medium text-gray-700 mb-1">配置值</label>
                            <input type="text" id="configValue" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" required>
                        </div>
                        <div class="mb-4">
                            <label class="block text-sm font-medium text-gray-700 mb-1">分类</label>
                            <select id="configCategory" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                                <option value="GENERAL">通用</option>
                                <option value="EXPERIENCE">经验</option>
                                <option value="DROP">掉落</option>
                                <option value="SHOP">商店</option>
                                <option value="REALM">境界</option>
                                <option value="PET">宠物</option>
                                <option value="ACTIVITY">活动</option>
                                <option value="SYSTEM">系统</option>
                            </select>
                        </div>
                        <div class="mb-4">
                            <label class="block text-sm font-medium text-gray-700 mb-1">描述</label>
                            <textarea id="configDescription" rows="3" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
                        </div>
                    </form>
                </div>
                <div class="px-6 py-4 border-t border-gray-200 flex justify-end space-x-2">
                    <button id="cancelBtn" class="px-4 py-2 text-sm bg-gray-300 text-gray-700 rounded-md hover:bg-gray-400">
                        取消
                    </button>
                    <button id="saveBtn" class="px-4 py-2 text-sm bg-blue-500 text-white rounded-md hover:bg-blue-600">
                        保存
                    </button>
                </div>
            </div>
        </div>
    </div>
    
    <script src="js/api.js"></script>
    <script src="js/config-management.js"></script>
</body>
</html>
