<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>剧情系统 - 修仙挂机游戏</title>
    <link rel="stylesheet" href="/css/core/variables.css">
    <link rel="stylesheet" href="/css/core/reset.css">
    <link rel="stylesheet" href="/css/core/base.css">
    <link rel="stylesheet" href="/css/components/toast.css">
    <link rel="stylesheet" href="/css/modules/game.css">
    <link rel="stylesheet" href="/css/modules/narrative.css">
</head>
<body>
    <div id="app">
        <div class="game-container">
            <nav class="game-nav">
                <a href="#player" class="nav-link">玩家</a>
                <a href="#narrative" class="nav-link active">剧情</a>
                <a href="#cultivate" class="nav-link">修炼</a>
            </nav>

            <main class="game-main">
                <div class="narrative-page">
                    <h1 class="page-title">剧情模式</h1>
                    
                    <div class="narrative-content">
                        <div class="chapter-list" id="chapterList">
                            <div class="loading">加载剧情中...</div>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script type="module">
        import { App } from '/js/App.js';
        const app = new App();
        app.init();
        import('/js/modules/narrative/index.js').then(module => {
            module.narrativeUI.init();
        });
    </script>
</body>
</html>
