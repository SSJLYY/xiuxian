<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>背包系统 - 修仙挂机游戏</title>
    <link rel="stylesheet" href="/css/core/variables.css">
    <link rel="stylesheet" href="/css/core/reset.css">
    <link rel="stylesheet" href="/css/core/base.css">
    <link rel="stylesheet" href="/css/components/modal.css">
    <link rel="stylesheet" href="/css/components/toast.css">
    <link rel="stylesheet" href="/css/components/loading.css">
    <link rel="stylesheet" href="/css/modules/game.css">
    <link rel="stylesheet" href="/css/modules/inventory.css">
</head>
<body>
    <div id="app">
        <div class="game-container">
            <nav class="game-nav">
                <a href="#player" class="nav-link">玩家</a>
                <a href="#combat" class="nav-link">战斗</a>
                <a href="#inventory" class="nav-link active">背包</a>
                <a href="#equipment" class="nav-link">装备</a>
                <a href="#skills" class="nav-link">技能</a>
                <a href="#cultivate" class="nav-link">修炼</a>
                <a href="#map" class="nav-link">地图</a>
            </nav>

            <main class="game-main">
                <div class="inventory-page">
                    <h1 class="page-title">背包系统</h1>
                    
                    <div class="inventory-content">
                        <div class="inventory-info">
                            <p>背包容量: <span id="inventoryCapacity">0/100</span></p>
                        </div>

                        <div class="inventory-grid" id="inventoryGrid">
                            <div class="loading">加载背包中...</div>
                        </div>

                        <div class="item-detail" id="itemDetail" style="display: none;">
                            <h3 id="itemName">物品名称</h3>
                            <p id="itemDesc">物品描述</p>
                            <div class="item-actions">
                                <button id="useItemBtn">使用</button>
                                <button id="sellItemBtn">出售</button>
                            </div>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script type="module">
        import { App } from '/js/App.js';
        
        const app = new App();
        app.init();
        
        import('/js/modules/inventory/index.js').then(module => {
            module.inventoryUI.init();
        });
    </script>
</body>
</html>
