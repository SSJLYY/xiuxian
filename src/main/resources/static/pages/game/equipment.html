<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>装备系统 - 修仙挂机游戏</title>
    <link rel="stylesheet" href="/css/core/variables.css">
    <link rel="stylesheet" href="/css/core/reset.css">
    <link rel="stylesheet" href="/css/core/base.css">
    <link rel="stylesheet" href="/css/components/modal.css">
    <link rel="stylesheet" href="/css/components/toast.css">
    <link rel="stylesheet" href="/css/modules/game.css">
    <link rel="stylesheet" href="/css/modules/equipment.css">
</head>
<body>
    <div id="app">
        <div class="game-container">
            <nav class="game-nav">
                <a href="#player" class="nav-link">玩家</a>
                <a href="#combat" class="nav-link">战斗</a>
                <a href="#inventory" class="nav-link">背包</a>
                <a href="#equipment" class="nav-link active">装备</a>
                <a href="#skills" class="nav-link">技能</a>
                <a href="#cultivate" class="nav-link">修炼</a>
                <a href="#map" class="nav-link">地图</a>
            </nav>

            <main class="game-main">
                <div class="equipment-page">
                    <h1 class="page-title">装备系统</h1>
                    
                    <div class="equipment-content">
                        <div class="character-equip">
                            <h2>当前装备</h2>
                            <div class="equip-slots">
                                <div class="equip-slot" data-slot="weapon">武器</div>
                                <div class="equip-slot" data-slot="armor">护甲</div>
                                <div class="equip-slot" data-slot="helmet">头盔</div>
                                <div class="equip-slot" data-slot="boots">靴子</div>
                                <div class="equip-slot" data-slot="accessory">饰品</div>
                            </div>
                        </div>

                        <div class="equipment-list">
                            <h2>可用装备</h2>
                            <div class="equip-items" id="equipItems">
                                <div class="loading">加载装备中...</div>
                            </div>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script type="module">
        import { App } from '/js/App.js';
        const app = new App();
        app.init();
        import('/js/modules/equipment/index.js').then(module => {
            module.equipmentUI.init();
        });
    </script>
</body>
</html>
