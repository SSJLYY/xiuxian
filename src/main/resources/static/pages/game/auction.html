<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>拍卖行 - 修仙挂机游戏</title>
    <link rel="stylesheet" href="/css/core/variables.css">
    <link rel="stylesheet" href="/css/core/reset.css">
    <link rel="stylesheet" href="/css/core/base.css">
    <link rel="stylesheet" href="/css/components/modal.css">
    <link rel="stylesheet" href="/css/components/toast.css">
    <link rel="stylesheet" href="/css/modules/game.css">
    <link rel="stylesheet" href="/css/modules/auction.css">
</head>
<body>
    <div id="app">
        <div class="game-container">
            <nav class="game-nav">
                <a href="#player" class="nav-link">玩家</a>
                <a href="#inventory" class="nav-link">背包</a>
                <a href="#auction" class="nav-link active">拍卖行</a>
                <a href="#shop" class="nav-link">商城</a>
                <a href="#cultivate" class="nav-link">修炼</a>
            </nav>

            <main class="game-main">
                <div class="auction-page">
                    <h1 class="page-title">拍卖行</h1>
                    
                    <div class="auction-content">
                        <div class="auction-tabs mb-4">
                            <button class="tab-btn active" data-auction-tab="browse" onclick="switchAuctionTab('browse')">拍卖列表</button>
                            <button class="tab-btn" data-auction-tab="mine" onclick="switchAuctionTab('mine')">我的拍卖</button>
                        </div>

                        <div id="auction-browse-panel">
                            <div id="auction-items-list" class="auction-list">
                                <div class="loading">加载拍卖物品中...</div>
                            </div>
                        </div>

                        <div id="auction-mine-panel" style="display:none;">
                            <div id="auction-my-items-list" class="my-auction-items">
                                <div class="loading">加载我的拍卖中...</div>
                            </div>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script type="module">
        import { App } from '/js/App.js';
        import { mountAuctionGlobals } from '/js/modules/auction/index.js';
        const app = new App();
        app.init();
        mountAuctionGlobals().init();
    </script>
</body>
</html>
