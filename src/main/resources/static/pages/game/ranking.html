<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>排行榜 - 修仙挂机游戏</title>
    <link rel="stylesheet" href="/css/core/variables.css">
    <link rel="stylesheet" href="/css/core/reset.css">
    <link rel="stylesheet" href="/css/core/base.css">
    <link rel="stylesheet" href="/css/components/toast.css">
    <link rel="stylesheet" href="/css/modules/game.css">
    <link rel="stylesheet" href="/css/modules/ranking.css">
</head>
<body>
    <div id="app">
        <div class="game-container">
            <nav class="game-nav">
                <a href="#player" class="nav-link">玩家</a>
                <a href="#ranking" class="nav-link active">排行榜</a>
                <a href="#combat" class="nav-link">战斗</a>
                <a href="#cultivate" class="nav-link">修炼</a>
            </nav>

            <main class="game-main">
                <div class="ranking-page">
                    <h1 class="page-title">排行榜</h1>
                    
                    <div class="ranking-content">
                        <div class="ranking-tabs">
                            <button class="tab-btn active" data-tab="level-rank">等级排行</button>
                            <button class="tab-btn" data-tab="power-rank">战力排行</button>
                            <button class="tab-btn" data-tab="guild-rank">宗门排行</button>
                        </div>

                        <div class="ranking-list" id="rankingList">
                            <div class="loading">加载排行榜中...</div>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script type="module">
        import { App } from '/js/App.js';
        import { mountRankingGlobals } from '/js/modules/ranking/index.js';

        const app = new App();
        app.init();
        mountRankingGlobals().init();
    </script>
</body>
</html>
