<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>邮件系统 - 修仙挂机游戏</title>
    <link rel="stylesheet" href="/css/core/variables.css">
    <link rel="stylesheet" href="/css/core/reset.css">
    <link rel="stylesheet" href="/css/core/base.css">
    <link rel="stylesheet" href="/css/components/toast.css">
    <link rel="stylesheet" href="/css/modules/game.css">
    <link rel="stylesheet" href="/css/modules/mail.css">
</head>
<body>
    <div id="app">
        <div class="game-container">
            <nav class="game-nav">
                <a href="#player" class="nav-link">玩家</a>
                <a href="#mail" class="nav-link active">邮件</a>
                <a href="#cultivate" class="nav-link">修炼</a>
            </nav>

            <main class="game-main">
                <div class="mail-page">
                    <h1 class="page-title">邮件系统</h1>
                    
                    <div class="mail-content">
                        <div class="mail-list" id="mailList">
                            <div class="loading">加载邮件中...</div>
                        </div>

                        <div class="mail-detail" id="mailDetail" style="display: none;">
                            <h2 id="mailTitle">邮件标题</h2>
                            <p id="mailSender">发件人: 系统</p>
                            <p id="mailTime">时间: 2026-03-27</p>
                            <div id="mailContent">邮件内容</div>
                            <div class="mail-attachments" id="mailAttachments">
                                <h3>附件</h3>
                            </div>
                            <button id="collectAttachmentsBtn" class="btn-primary">领取附件</button>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script type="module">
        import { App } from '/js/App.js';
        const app = new App();
        app.init();
        import('/js/modules/mail/index.js').then(module => {
            module.mailUI.init();
        });
    </script>
</body>
</html>
