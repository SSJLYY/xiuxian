<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>宠物系统 - 修仙挂机游戏</title>
    <link rel="stylesheet" href="/css/core/variables.css">
    <link rel="stylesheet" href="/css/core/reset.css">
    <link rel="stylesheet" href="/css/core/base.css">
    <link rel="stylesheet" href="/css/components/modal.css">
    <link rel="stylesheet" href="/css/components/toast.css">
    <link rel="stylesheet" href="/css/modules/game.css">
    <link rel="stylesheet" href="/css/modules/pets.css">
</head>
<body>
    <div id="app">
        <div class="game-container">
            <nav class="game-nav">
                <a href="#player" class="nav-link">玩家</a>
                <a href="#combat" class="nav-link">战斗</a>
                <a href="#inventory" class="nav-link">背包</a>
                <a href="#equipment" class="nav-link">装备</a>
                <a href="#skills" class="nav-link">技能</a>
                <a href="#pets" class="nav-link active">宠物</a>
                <a href="#cultivate" class="nav-link">修炼</a>
            </nav>

            <main class="game-main">
                <div class="pets-page">
                    <h1 class="page-title">宠物系统</h1>
                    
                    <div class="pets-content">
                        <div class="pets-list-section">
                            <h2>我的宠物</h2>
                            <div class="pets-list" id="petsList">
                                <div class="loading">加载宠物中...</div>
                            </div>
                        </div>

                        <div class="pet-capture-section">
                            <h2>捕获宠物</h2>
                            <div class="wild-pets" id="wildPets">
                                <div class="loading">加载野生宠物中...</div>
                            </div>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script type="module">
        import { App } from '/js/App.js';
        const app = new App();
        app.init();
        import('/js/modules/pets/index.js').then(module => {
            module.petsUI.init();
        });
    </script>
</body>
</html>
