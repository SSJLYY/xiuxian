<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>修炼系统 - 修仙挂机游戏</title>
    <link rel="stylesheet" href="/css/core/variables.css">
    <link rel="stylesheet" href="/css/core/reset.css">
    <link rel="stylesheet" href="/css/core/base.css">
    <link rel="stylesheet" href="/css/components/toast.css">
    <link rel="stylesheet" href="/css/modules/game.css">
    <link rel="stylesheet" href="/css/modules/cultivate.css">
</head>
<body>
    <div id="app">
        <div class="game-container">
            <nav class="game-nav">
                <a href="#player" class="nav-link">玩家</a>
                <a href="#cultivate" class="nav-link active">修炼</a>
                <a href="#combat" class="nav-link">战斗</a>
                <a href="#map" class="nav-link">地图</a>
            </nav>

            <main class="game-main">
                <div class="cultivate-page">
                    <h1 class="page-title">修炼系统</h1>
                    
                    <div class="cultivate-content">
                        <div class="cultivate-status">
                            <h2>当前境界: <span id="currentRealm">练气期1层</span></h2>
                            <p>灵气值: <span id="qiValue">0</span> / <span id="maxQi">100</span></p>
                            <p>修炼速度: <span id="speed">1</span></p>
                        </div>

                        <div class="cultivate-actions">
                            <button id="startCultivateBtn" class="btn-primary">开始修炼</button>
                            <button id="breakthroughBtn" class="btn-secondary">突破境界</button>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script type="module">
        import { App } from '/js/App.js';
        const app = new App();
        app.init();
        import('/js/modules/cultivate/index.js').then(module => {
            module.cultivateUI.init();
        });
    </script>
</body>
</html>
