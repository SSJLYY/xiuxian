<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>兑换码 - 修仙挂机游戏</title>
    <link rel="stylesheet" href="/css/core/variables.css">
    <link rel="stylesheet" href="/css/core/reset.css">
    <link rel="stylesheet" href="/css/core/base.css">
    <link rel="stylesheet" href="/css/components/toast.css">
    <link rel="stylesheet" href="/css/modules/game.css">
    <link rel="stylesheet" href="/css/modules/giftcode.css">
</head>
<body>
    <div id="app">
        <div class="game-container">
            <nav class="game-nav">
                <a href="#player" class="nav-link">玩家</a>
                <a href="#giftcode" class="nav-link active">兑换码</a>
                <a href="#cultivate" class="nav-link">修炼</a>
            </nav>

            <main class="game-main">
                <div class="giftcode-page">
                    <h1 class="page-title">兑换码</h1>
                    
                    <div class="giftcode-content">
                        <div class="giftcode-input">
                            <input type="text" id="giftcodeInput" placeholder="请输入兑换码">
                            <button id="redeemBtn" class="btn-primary">兑换</button>
                        </div>

                        <div class="giftcode-history">
                            <h2>兑换记录</h2>
                            <div id="giftcodeHistory">
                                <p>暂无兑换记录</p>
                            </div>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script type="module">
        import { App } from '/js/App.js';
        const app = new App();
        app.init();
        import('/js/modules/giftcode/index.js').then(module => {
            module.giftcodeUI.init();
        });
    </script>
</body>
</html>
