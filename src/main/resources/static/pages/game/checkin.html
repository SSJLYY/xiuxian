<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>签到系统 - 修仙挂机游戏</title>
    <link rel="stylesheet" href="/css/core/variables.css">
    <link rel="stylesheet" href="/css/core/reset.css">
    <link rel="stylesheet" href="/css/core/base.css">
    <link rel="stylesheet" href="/css/components/toast.css">
    <link rel="stylesheet" href="/css/modules/game.css">
    <link rel="stylesheet" href="/css/modules/checkin.css">
</head>
<body>
    <div id="app">
        <div class="game-container">
            <nav class="game-nav">
                <a href="#player" class="nav-link">玩家</a>
                <a href="#checkin" class="nav-link active">签到</a>
                <a href="#cultivate" class="nav-link">修炼</a>
            </nav>

            <main class="game-main">
                <div id="checkin-module" class="module" style="display:block;">
                    <div class="checkin-panel">
                        <div class="module-header mb-4">
                            <h2><i class="fa-solid fa-calendar-check"></i> 每日签到</h2>
                        </div>
                        <div class="checkin-calendar mb-4 p-4 bg-secondary/5 rounded">
                            <div class="checkin-month-header flex items-center justify-between mb-4">
                                <button class="btn btn-sm" onclick="changeCheckinMonth(-1)"><i class="fa-solid fa-chevron-left"></i></button>
                                <h3 id="checkin-month-title" class="text-lg font-bold">签到日历</h3>
                                <button class="btn btn-sm" onclick="changeCheckinMonth(1)"><i class="fa-solid fa-chevron-right"></i></button>
                            </div>
                            <div class="checkin-weekdays grid grid-cols-7 gap-1 mb-2">
                                <div class="text-center text-xs text-muted">日</div>
                                <div class="text-center text-xs text-muted">一</div>
                                <div class="text-center text-xs text-muted">二</div>
                                <div class="text-center text-xs text-muted">三</div>
                                <div class="text-center text-xs text-muted">四</div>
                                <div class="text-center text-xs text-muted">五</div>
                                <div class="text-center text-xs text-muted">六</div>
                            </div>
                            <div id="checkin-days-grid" class="checkin-days-grid grid grid-cols-7 gap-1"></div>
                        </div>
                        <div class="checkin-action mb-4 text-center">
                            <button class="btn btn-lg" id="checkin-btn" onclick="doCheckIn()">
                                <i class="fa-solid fa-calendar-check"></i> 今日签到
                            </button>
                        </div>
                        <div class="checkin-stats p-4 bg-secondary/5 rounded">
                            <div class="flex items-center justify-around text-center">
                                <div>
                                    <div class="text-lg font-bold text-accent" id="checkin-consecutive-days">0</div>
                                    <div class="text-xs text-muted">连续签到</div>
                                </div>
                                <div>
                                    <div class="text-lg font-bold text-green-400" id="checkin-total-days">0</div>
                                    <div class="text-xs text-muted">累计签到</div>
                                </div>
                                <div>
                                    <div class="text-lg font-bold text-aqua" id="checkin-today-reward">0</div>
                                    <div class="text-xs text-muted">今日奖励</div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/modules.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (window.checkInSystem && typeof window.checkInSystem.init === 'function') {
                window.checkInSystem.init();
            }
        });
    </script>
</body>
</html>
