<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>签到系统 - 修仙挂机游戏</title>
    <link rel="stylesheet" href="/css/core/variables.css">
    <link rel="stylesheet" href="/css/core/reset.css">
    <link rel="stylesheet" href="/css/core/base.css">
    <link rel="stylesheet" href="/css/components/toast.css">
    <link rel="stylesheet" href="/css/modules/game.css">
    <link rel="stylesheet" href="/css/modules/checkin.css">
</head>
<body>
    <div id="app">
        <div class="game-container">
            <nav class="game-nav">
                <a href="#player" class="nav-link">玩家</a>
                <a href="#checkin" class="nav-link active">签到</a>
                <a href="#cultivate" class="nav-link">修炼</a>
            </nav>

            <main class="game-main">
                <div class="checkin-page">
                    <h1 class="page-title">每日签到</h1>
                    
                    <div class="checkin-content">
                        <div class="checkin-status">
                            <p>今日已签到: <span id="todayChecked">否</span></p>
                            <p>连续签到: <span id="consecutiveDays">0</span> 天</p>
                        </div>

                        <div class="checkin-calendar" id="checkinCalendar">
                            <h2>签到日历</h2>
                            <div class="calendar-grid">
                                <div class="calendar-day" data-day="1">第1天</div>
                                <div class="calendar-day" data-day="2">第2天</div>
                                <div class="calendar-day" data-day="3">第3天</div>
                                <div class="calendar-day" data-day="4">第4天</div>
                                <div class="calendar-day" data-day="5">第5天</div>
                                <div class="calendar-day" data-day="6">第6天</div>
                                <div class="calendar-day" data-day="7">第7天</div>
                            </div>
                        </div>

                        <button id="checkinBtn" class="btn-primary">立即签到</button>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script type="module">
        import { App } from '/js/App.js';
        const app = new App();
        app.init();
        import('/js/modules/checkin/index.js').then(module => {
            module.checkinUI.init();
        });
    </script>
</body>
</html>
