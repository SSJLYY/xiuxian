<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>技能系统 - 修仙挂机游戏</title>
    <link rel="stylesheet" href="/css/core/variables.css">
    <link rel="stylesheet" href="/css/core/reset.css">
    <link rel="stylesheet" href="/css/core/base.css">
    <link rel="stylesheet" href="/css/components/modal.css">
    <link rel="stylesheet" href="/css/components/toast.css">
    <link rel="stylesheet" href="/css/modules/game.css">
    <link rel="stylesheet" href="/css/modules/skills.css">
</head>
<body>
    <div id="app">
        <div class="game-container">
            <nav class="game-nav">
                <a href="#player" class="nav-link">玩家</a>
                <a href="#combat" class="nav-link">战斗</a>
                <a href="#inventory" class="nav-link">背包</a>
                <a href="#equipment" class="nav-link">装备</a>
                <a href="#skills" class="nav-link active">技能</a>
                <a href="#cultivate" class="nav-link">修炼</a>
                <a href="#map" class="nav-link">地图</a>
            </nav>

            <main class="game-main">
                <div class="skills-page">
                    <h1 class="page-title">技能系统</h1>
                    
                    <div class="skills-tabs">
                        <button class="tab-btn active" data-tab="my-skills">我的技能</button>
                        <button class="tab-btn" data-tab="learnable">可学习</button>
                    </div>

                    <div class="skills-content">
                        <div class="tab-pane active" id="my-skills">
                            <div class="skills-list" id="mySkillsList">
                                <div class="loading">加载技能中...</div>
                            </div>
                        </div>

                        <div class="tab-pane" id="learnable">
                            <div class="skills-list" id="learnableSkillsList">
                                <div class="loading">加载可学习技能中...</div>
                            </div>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script type="module">
        import { App } from '/js/App.js';
        const app = new App();
        app.init();
        import('/js/modules/skills/index.js').then(module => {
            module.skillsUI.init();
        });
    </script>
</body>
</html>
