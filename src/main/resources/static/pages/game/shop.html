<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>商城系统 - 修仙挂机游戏</title>
    <link rel="stylesheet" href="/css/core/variables.css">
    <link rel="stylesheet" href="/css/core/reset.css">
    <link rel="stylesheet" href="/css/core/base.css">
    <link rel="stylesheet" href="/css/components/toast.css">
    <link rel="stylesheet" href="/css/modules/game.css">
    <link rel="stylesheet" href="/css/modules/shop.css">
</head>
<body>
    <div id="app">
        <div class="game-container">
            <nav class="game-nav">
                <a href="#player" class="nav-link">玩家</a>
                <a href="#shop" class="nav-link active">商城</a>
                <a href="#auction" class="nav-link">拍卖</a>
                <a href="#cultivate" class="nav-link">修炼</a>
            </nav>

            <main class="game-main">
                <div class="shop-page">
                    <h1 class="page-title">商城</h1>
                    
                    <div class="shop-content">
                        <div class="shop-tabs">
                            <button class="tab-btn active" data-tab="daily-shop">每日商店</button>
                            <button class="tab-btn" data-tab="special-shop">限时商店</button>
                        </div>

                        <div class="shop-items" id="shopItems">
                            <div class="loading">加载商品中...</div>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script type="module">
        import { App } from '/js/App.js';
        const app = new App();
        app.init();
        import('/js/modules/shop/index.js').then(module => {
            module.shopUI.init();
        });
    </script>
</body>
</html>
