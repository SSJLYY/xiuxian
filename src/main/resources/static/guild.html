<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>宗门系统 - xiuxian挂机游戏</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@400;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="images/favicon.svg">
    <link rel="stylesheet" href="css/style.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#8B4513',
                        secondary: '#2F4F4F',
                        accent: '#CD5C5C',
                        light: '#F5F5DC',
                        dark: '#2C3E50',
                    },
                    fontFamily: {
                        ancient: ['"Ma Shan Zheng"', '"Noto Serif SC"', 'serif'],
                    }
                }
            }
        }
    </script>
    
    <style>
        /* 宗门系统特定样式 */
        .guild-container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        .guild-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        
        .guild-tab-btn {
            padding: 12px 24px;
            border: 2px solid rgba(139, 69, 19, 0.3);
            background: rgba(245, 245, 220, 0.5);
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 500;
            color: #2C3E50;
            font-size: 16px;
        }
        
        .guild-tab-btn:hover {
            background: rgba(139, 69, 19, 0.1);
            border-color: #8B4513;
        }
        
        .guild-tab-btn.active {
            background: linear-gradient(135deg, #8B4513, #CD5C5C);
            color: white;
            border-color: #8B4513;
        }
        
        .guild-content-section {
            display: none;
        }
        
        .guild-content-section.active {
            display: block;
        }
        
        /* 我的宗门卡片 */
        .my-guild-card {
            background: linear-gradient(135deg, rgba(139, 69, 19, 0.1), rgba(205, 92, 92, 0.1));
            border-radius: 15px;
            padding: 30px;
            border: 2px solid rgba(139, 69, 19, 0.3);
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
            margin-bottom: 30px;
        }
        
        .guild-header-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 15px;
        }
        
        .guild-name-display {
            font-size: 28px;
            font-weight: bold;
            color: #8B4513;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .guild-level-badge {
            background: linear-gradient(135deg, #8B4513, #CD5C5C);
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
        }
        
        .guild-stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .guild-stat-item {
            background: rgba(255, 255, 255, 0.7);
            padding: 15px;
            border-radius: 10px;
            text-align: center;
        }
        
        .guild-stat-value {
            font-size: 24px;
            font-weight: bold;
            color: #8B4513;
            display: block;
            margin-bottom: 5px;
        }
        
        .guild-stat-label {
            font-size: 14px;
            color: #718096;
        }
        
        .guild-progress-section {
            margin-top: 20px;
        }
        
        .guild-progress-bar {
            height: 12px;
            background: rgba(139, 69, 19, 0.2);
            border-radius: 6px;
            overflow: hidden;
            margin-bottom: 8px;
        }
        
        .guild-progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #8B4513, #CD5C5C);
            border-radius: 6px;
            transition: width 0.5s ease;
            position: relative;
            overflow: hidden;
        }
        
        .guild-progress-fill::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            animation: shimmer 2s infinite;
        }
        
        .guild-progress-text {
            font-size: 13px;
            color: #4a5568;
            text-align: right;
        }
        
        /* 宗门列表 */
        .guild-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(400px, 1fr));
            gap: 20px;
        }
        
        .guild-list-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 12px;
            padding: 20px;
            border: 2px solid rgba(139, 69, 19, 0.2);
            transition: all 0.3s ease;
            cursor: pointer;
        }
        
        .guild-list-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(139, 69, 19, 0.3);
            border-color: #8B4513;
        }
        
        .guild-list-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        
        .guild-list-name {
            font-size: 20px;
            font-weight: bold;
            color: #2C3E50;
        }
        
        .guild-list-stats {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 15px;
        }
        
        .guild-list-stat {
            font-size: 13px;
            color: #718096;
        }
        
        .guild-list-stat strong {
            color: #2C3E50;
        }
        
        /* 成员列表 */
        .member-list {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 12px;
            padding: 20px;
            border: 2px solid rgba(139, 69, 19, 0.2);
        }
        
        .member-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            border-bottom: 1px solid rgba(139, 69, 19, 0.1);
            transition: background 0.2s ease;
        }
        
        .member-item:hover {
            background: rgba(139, 69, 19, 0.05);
        }
        
        .member-item:last-child {
            border-bottom: none;
        }
        
        .member-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .member-avatar {
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, #8B4513, #CD5C5C);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 20px;
            font-weight: bold;
        }
        
        .member-details {
            display: flex;
            flex-direction: column;
        }
        
        .member-name {
            font-size: 16px;
            font-weight: 600;
            color: #2C3E50;
        }
        
        .member-role-badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: 600;
            margin-top: 3px;
        }
        
        .member-role-badge.leader {
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: white;
        }
        
        .member-role-badge.officer {
            background: linear-gradient(135deg, #8b5cf6, #7c3aed);
            color: white;
        }
        
        .member-role-badge.member {
            background: rgba(139, 69, 19, 0.2);
            color: #8B4513;
        }
        
        .member-contribution {
            font-size: 14px;
            color: #718096;
        }
        
        /* 创建宗门表单 */
        .create-guild-form {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 12px;
            padding: 30px;
            border: 2px solid rgba(139, 69, 19, 0.2);
            max-width: 600px;
            margin: 0 auto;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #2C3E50;
            margin-bottom: 8px;
        }
        
        .form-input {
            width: 100%;
            padding: 12px;
            border: 2px solid rgba(139, 69, 19, 0.2);
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s ease;
        }
        
        .form-input:focus {
            outline: none;
            border-color: #8B4513;
        }
        
        .form-textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid rgba(139, 69, 19, 0.2);
            border-radius: 8px;
            font-size: 14px;
            resize: vertical;
            min-height: 100px;
        }
        
        .form-textarea:focus {
            outline: none;
            border-color: #8B4513;
        }
        
        .form-hint {
            font-size: 12px;
            color: #718096;
            margin-top: 5px;
        }
        
        /* 捐献面板 */
        .donate-panel {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 12px;
            padding: 25px;
            border: 2px solid rgba(139, 69, 19, 0.2);
            max-width: 500px;
            margin: 0 auto;
        }
        
        .donate-amount-input {
            width: 100%;
            padding: 15px;
            border: 2px solid rgba(139, 69, 19, 0.2);
            border-radius: 8px;
            font-size: 18px;
            text-align: center;
            margin-bottom: 15px;
        }
        
        .donate-quick-btns {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }
        
        .donate-quick-btn {
            padding: 10px;
            border: 2px solid rgba(139, 69, 19, 0.3);
            background: rgba(245, 245, 220, 0.5);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 500;
        }
        
        .donate-quick-btn:hover {
            background: rgba(139, 69, 19, 0.1);
            border-color: #8B4513;
        }
        
        /* 空状态 */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #a0aec0;
        }
        
        .loading-spinner {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 60px 20px;
        }
        
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(139, 69, 19, 0.2);
            border-top: 4px solid #8B4513;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }
        
        /* 分页 */
        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-top: 30px;
        }
        
        .pagination-btn {
            padding: 8px 16px;
            border: 2px solid rgba(139, 69, 19, 0.3);
            background: rgba(245, 245, 220, 0.5);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .pagination-btn:hover:not(:disabled) {
            background: rgba(139, 69, 19, 0.1);
            border-color: #8B4513;
        }
        
        .pagination-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .pagination-info {
            font-size: 14px;
            color: #718096;
        }
    </style>
</head>
<body class="font-ancient">
    <!-- 宗门页面 -->
    <div class="container mx-auto px-4 py-6">
        <!-- 页面头部 -->
        <header class="game-header mb-6">
            <div class="flex justify-between items-center">
                <h1 class="text-3xl font-bold text-primary">
                    <i class="fa fa-users"></i> 宗门系统
                </h1>
                <button class="btn btn-secondary" onclick="window.location.href='index.html'">
                    <i class="fa fa-arrow-left"></i> 返回主页
                </button>
            </div>
        </header>

        <!-- 宗门内容 -->
        <div class="guild-container">
            <!-- 宗门标签 -->
            <div class="guild-tabs">
                <button class="guild-tab-btn active" data-tab="my-guild" onclick="switchGuildTab('my-guild')">
                    <i class="fa fa-home"></i> 我的宗门
                </button>
                <button class="guild-tab-btn" data-tab="guild-boss" onclick="switchGuildTab('guild-boss')">
                    <i class="fa fa-dragon"></i> 宗门BOSS
                </button>
                <button class="guild-tab-btn" data-tab="guild-list" onclick="switchGuildTab('guild-list')">
                    <i class="fa fa-list"></i> 宗门列表
                </button>
                <button class="guild-tab-btn" data-tab="create-guild" onclick="switchGuildTab('create-guild')">
                    <i class="fa fa-plus-circle"></i> 创建宗门
                </button>
            </div>

            <!-- 我的宗门 -->
            <div id="myGuildSection" class="guild-content-section active">
                <div id="myGuildContent">
                    <div class="loading-spinner">
                        <div class="spinner"></div>
                        <p style="margin-top: 15px; color: #718096;">加载宗门数据...</p>
                    </div>
                </div>
            </div>

            <!-- 宗门BOSS -->
            <div id="guildBossSection" class="guild-content-section">
                <div id="guild-boss-container" style="padding:1rem;">
                    <div class="loading-spinner"><div class="spinner"></div><p>加载BOSS数据...</p></div>
                </div>
            </div>

            <!-- 宗门列表 -->
            <div id="guildListSection" class="guild-content-section">
                <div id="guildListContent">
                    <div class="loading-spinner">
                        <div class="spinner"></div>
                        <p style="margin-top: 15px; color: #718096;">加载宗门列表...</p>
                    </div>
                </div>
            </div>

            <!-- 创建宗门 -->
            <div id="createGuildSection" class="guild-content-section">
                <div class="create-guild-form">
                    <h2 class="text-2xl font-bold text-primary mb-6 text-center">
                        <i class="fa fa-plus-circle"></i> 创建宗门
                    </h2>
                    
                    <div class="form-group">
                        <label class="form-label">宗门名称 *</label>
                        <input type="text" id="guildNameInput" class="form-input" placeholder="请输入宗门名称" maxlength="20">
                        <p class="form-hint">宗门名称不能超过20个字符</p>
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label">宗门简介</label>
                        <textarea id="guildDescInput" class="form-textarea" placeholder="请输入宗门简介（选填）" maxlength="200"></textarea>
                        <p class="form-hint">宗门简介不能超过200个字符</p>
                    </div>
                    
                    <div class="form-group">
                        <div style="background: rgba(139, 69, 19, 0.1); padding: 15px; border-radius: 8px; margin-bottom: 20px;">
                            <p style="font-size: 14px; color: #8B4513; margin-bottom: 8px;">
                                <i class="fa fa-info-circle"></i> 创建条件：
                            </p>
                            <ul style="font-size: 13px; color: #718096; list-style: disc; margin-left: 20px;">
                                <li>等级达到 20 级</li>
                                <li>消耗 10,000 灵石</li>
                            </ul>
                        </div>
                    </div>
                    
                    <button class="btn btn-primary w-full" onclick="createGuild()">
                        <i class="fa fa-check"></i> 创建宗门
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- 消息提示 -->
    <div id="toast" class="toast hidden">
        <span id="toastMessage"></span>
    </div>

    <!-- 加载动画 -->
    <div id="loading" class="loading hidden">
        <div class="spinner"></div>
        <span>处理中...</span>
    </div>

    <!-- 加载脚本 -->
    <script src="js/api.js"></script>
    <script src="js/guild.js"></script>
    <script src="js/guild-boss.js"></script>
</body>
</html>
