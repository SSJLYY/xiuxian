<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>宠物系统 - 修仙挂机游戏</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container active" style="padding:20px;max-width:1400px;margin:0 auto;">
        <header class="game-header" style="margin-bottom:20px;">
            <div class="player-info">
                <h2><i class="fa-solid fa-paw"></i> 宠物系统</h2>
                <div class="player-stats">
                    <span><i class="fa-solid fa-star"></i> 等级: <span id="playerLevel">1</span></span>
                    <span><i class="fa-solid fa-gem"></i> 灵石: <span id="playerSpiritStones">0</span></span>
                </div>
            </div>
            <div class="header-actions">
                <button class="btn btn-secondary" onclick="window.location.href='game.html'">
                    <i class="fa-solid fa-arrow-left"></i> 返回游戏
                </button>
            </div>
        </header>

        <div id="pets-module" class="module" style="display:block;">
            <div class="pets-panel">
                <div class="module-header mb-4">
                    <h2><i class="fa-solid fa-paw"></i> 宠物系统</h2>
                </div>
                <div class="pets-tabs mb-4">
                    <button class="tab-btn active" data-pet-tab="my" onclick="switchPetTab('my')">我的宠物</button>
                    <button class="tab-btn" data-pet-tab="available" onclick="switchPetTab('available')">可捕获</button>
                </div>
                <div id="pets-my-panel">
                    <div id="active-pet-info" class="active-pet-card mb-4 p-4 rounded" style="display:none;"></div>
                    <div id="myPetsList" class="pets-grid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:15px;"></div>
                </div>
                <div id="pets-available-panel" style="display:none;">
                    <div id="availablePetsList" class="pets-available-grid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:15px;"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/modules.js"></script>
    <script src="js/pet-hunger-monitor.js"></script>
    <script src="js/breakthrough-evolution.js"></script>
    <script src="js/combo-pokedex.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            if (!window.authManager) {
                window.authManager = new AuthManager();
            }

            const isAuth = await window.authManager.checkAuthStatus();
            if (!isAuth) {
                window.location.href = 'login.html';
                return;
            }

            try {
                const response = await gameAPI.getCurrentPlayerProfile();
                if (response.success && response.data) {
                    document.getElementById('playerLevel').textContent = response.data.level || 1;
                    document.getElementById('playerSpiritStones').textContent = response.data.spiritStones || 0;
                }
            } catch (error) {
                console.error('加载玩家信息失败:', error);
            }

            if (window.loadMyPets) {
                await window.loadMyPets();
            }
        });
    </script>
</body>
</html>
