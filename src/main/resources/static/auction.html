<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>拍卖行 - xiuxian挂机游戏</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#8B4513',
                        secondary: '#2F4F4F',
                        accent: '#CD5C5C',
                        light: '#F5F5DC',
                        dark: '#2C3E50',
                    },
                    fontFamily: {
                        ancient: ['"Ma Shan Zheng"', '"Noto Serif SC"', 'serif'],
                    }
                }
            }
        }
    </script>
    <style>
        .fa-gavel:before { content: "🔨"; }
        .fa-coins:before { content: "💰"; }
        .fa-history:before { content: "📜"; }
        .fa-filter:before { content: "🔍"; }
        .fa-tag:before { content: "🏷️"; }
    </style>
</head>
<body>
    <!-- 游戏主界面 -->
    <div id="gamePage" class="container" style="display: flex; flex-direction: column;">
        <!-- 顶部导航 -->
        <header class="game-header">
            <div class="player-info">
                <h2><i class="fas fa-user-circle"></i> <span id="playerName">xiuxian者</span></h2>
                <div class="player-stats">
                    <span><i class="fas fa-star"></i> 等级: <span id="playerLevel">1</span></span>
                    <span><i class="fas fa-gem"></i> 境界: <span id="playerRealm">练气期</span></span>
                    <span><i class="fas fa-coins"></i> 灵石: <span id="playerSpiritStones">1000</span></span>
                </div>
            </div>
            <div class="header-actions">
                <button class="btn btn-secondary" onclick="goBack()">
                    <i class="fas fa-arrow-left"></i> 返回游戏
                </button>
            </div>
        </header>

        <!-- 主菜单导航 -->
        <nav class="main-nav">
            <ul class="nav-tabs">
                <li class="nav-tab active" data-module="browse">
                    <button onclick="showTab('browse')">
                        <i class="fas fa-gavel"></i> 浏览拍卖
                    </button>
                </li>
                <li class="nav-tab" data-module="my-auctions">
                    <button onclick="showTab('my-auctions')">
                        <i class="fas fa-history"></i> 我的拍卖
                    </button>
                </li>
            </ul>
        </nav>

        <!-- 主内容区 -->
        <main class="game-main">
            <!-- 浏览拍卖物品 -->
            <div id="browse-tab" class="tab-content active">
                <div class="module-header">
                    <h2><i class="fas fa-gavel"></i> 拍卖行</h2>
                    <p>在这里可以购买其他玩家拍卖的物品</p>
                </div>
                
                <!-- 搜索和过滤 -->
                <div class="panel-section mb-4">
                    <div class="flex flex-wrap gap-4 items-center">
                        <div>
                            <label class="block text-sm font-medium mb-1">物品类型</label>
                            <select id="itemTypeFilter" class="form-control">
                                <option value="">全部类型</option>
                                <option value="ITEM">普通物品</option>
                                <option value="EQUIPMENT">装备</option>
                                <option value="PET">宠物</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium mb-1">最低价格</label>
                            <input type="number" id="minPriceFilter" class="form-control" placeholder="0">
                        </div>
                        <div>
                            <label class="block text-sm font-medium mb-1">最高价格</label>
                            <input type="number" id="maxPriceFilter" class="form-control" placeholder="无限">
                        </div>
                        <div class="self-end">
                            <button class="btn btn-primary" onclick="loadAuctionItems(1)">
                                <i class="fas fa-filter"></i> 筛选
                            </button>
                        </div>
                    </div>
                </div>
                
                <!-- 拍卖物品列表 -->
                <div class="panel-section">
                    <div id="auctionItemsContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                        <!-- 拍卖物品将通过JavaScript动态加载 -->
                    </div>
                    
                    <!-- 分页 -->
                    <div id="pagination" class="mt-6 flex justify-center">
                        <!-- 分页控件将通过JavaScript动态加载 -->
                    </div>
                </div>
            </div>
            
            <!-- 我的拍卖 -->
            <div id="my-auctions-tab" class="tab-content" style="display: none;">
                <div class="module-header">
                    <h2><i class="fas fa-history"></i> 我的拍卖</h2>
                    <p>查看和管理您拍卖的物品</p>
                </div>
                
                <!-- 状态过滤 -->
                <div class="panel-section mb-4">
                    <div class="flex flex-wrap gap-4">
                        <button class="btn btn-secondary" onclick="loadMyAuctions('')">全部</button>
                        <button class="btn btn-secondary" onclick="loadMyAuctions('ON_SALE')">拍卖中</button>
                        <button class="btn btn-secondary" onclick="loadMyAuctions('SOLD')">已售出</button>
                        <button class="btn btn-secondary" onclick="loadMyAuctions('CANCELLED')">已取消</button>
                        <button class="btn btn-secondary" onclick="loadMyAuctions('EXPIRED')">已过期</button>
                    </div>
                </div>
                
                <!-- 我的拍卖物品列表 -->
                <div class="panel-section">
                    <div id="myAuctionsContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                        <!-- 我的拍卖物品将通过JavaScript动态加载 -->
                    </div>
                </div>
            </div>
            
        </main>
    </div>

    <!-- 消息提示 -->
    <div id="toast" class="toast hidden">
        <span id="toastMessage"></span>
    </div>

    <!-- 加载动画 -->
    <div id="loading" class="loading hidden">
        <div class="spinner"></div>
        <span>加载中...</span>
    </div>

    <!-- 脚本 -->
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/game.js"></script>
    <script type="module">
        import { mountAuctionGlobals } from './js/modules/auction/index.js';

        document.addEventListener('DOMContentLoaded', function() {
            if (window.authManager?.loadPlayerProfile) {
                window.authManager.loadPlayerProfile();
            }
            mountAuctionGlobals().init();
        });

        window.goBack = function() {
            window.location.href = 'index.html';
        };

        window.showTab = function(tab) {
            document.querySelectorAll('.tab-content').forEach(el => {
                el.style.display = 'none';
            });
            document.querySelectorAll('.nav-tab').forEach(el => {
                el.classList.remove('active');
            });
            const content = document.getElementById(`${tab}-tab`);
            const nav = document.querySelector(`.nav-tab[data-module="${tab}"]`);
            if (content) content.style.display = 'block';
            if (nav) nav.classList.add('active');
            if (tab === 'browse') return window.auctionUI?.loadAuctionItems();
            if (tab === 'my-auctions') return window.auctionUI?.loadMyAuctionItems();
        };

        window.loadMyAuctions = async function() {
            return window.auctionUI?.loadMyAuctionItems();
        };
    </script>
</body>
</html>
