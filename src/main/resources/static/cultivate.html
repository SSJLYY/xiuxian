<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>xiuxian挂机游戏 - xiuxian - 水墨风格</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" type="image/svg+xml" href="images/favicon.svg">
    
    <!-- 配置Tailwind自定义颜色和字体 -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#8B4513',
                        secondary: '#2F4F4F',
                        accent: '#CD5C5C',
                        light: '#F5F5DC',
                        dark: '#2C3E50',
                    },
                    fontFamily: {
                        ancient: ['"Ma Shan Zheng"', '"Noto Serif SC"', 'serif'],
                    }
                }
            }
        }
    </script>
</head>
<body>
    <div id="gamePage" class="container active">
        <header class="game-header">
            <div class="player-info">
                <h2><i class="fa-solid fa-user"></i> <span id="playerName">xiuxian者</span></h2>
                <div class="player-stats">
                    <span><i class="fa-solid fa-star"></i> 等级: <span id="playerLevel">1</span></span>
                    <span><i class="fa-solid fa-gem"></i> 境界: <span id="playerRealm">练气期</span></span>
                    <span><i class="fa-solid fa-chart-line"></i> 进度: <span id="playerExp">0</span>/<span id="expToNext">100</span></span>
                    <span><i class="fa-solid fa-gem"></i> 灵石: <span id="playerSpiritStones">0</span></span>
                </div>
            </div>
            <div class="header-actions">
                <button class="btn btn-primary" onclick="window.location.href='equipment.html'" title="装备系统">
                    <i class="fa-solid fa-shield"></i> 装备
                </button>
                <button class="btn btn-primary" onclick="window.location.href='pets.html'" title="宠物系统" style="background: linear-gradient(135deg, #48bb78, #38a169);">
                    <i class="fa-solid fa-paw"></i> 宠物
                </button>
                <button class="btn btn-secondary" onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i> 退出</button>
            </div>
        </header>
        <main class="game-main">
            <section class="game-area">
                <div class="cultivation-area">
                    <h3><i class="fa-solid fa-yin-yang"></i> 修炼区域</h3>
                    <div class="cultivation-status">
                        <p id="cultivationStatus">点击开始修炼</p>
                        <div class="progress-bar"><div class="progress" id="expProgress" style="width: 0%"></div></div>
                        <div class="flex justify-center gap-2"><span id="expText">0/100</span><span id="cycleCount">小周期 0 次</span></div>
                        <div class="mt-3 flex gap-3 justify-center">
                            <button id="cultivation-btn" class="btn btn-success"><i class="fa-solid fa-play"></i> 开始修炼</button>
                            <button id="stop-cultivation-btn" class="btn btn-secondary" onclick="stopCultivation()" style="display:none;"><i class="fa-solid fa-stop"></i> 停止修炼</button>
                        </div>
                    </div>
                </div>
            </section>
            <aside class="right-panel">
                <div class="panel-section">
                    <!-- 战斗区域 -->
                    <div class="combat-section mb-6">
                        <h3 class="text-lg font-bold mb-3">战斗区域</h3>
                        
                        <!-- 地图选择 -->
                        <div class="mb-3">
                            <label class="block text-sm font-medium mb-1">选择地图:</label>
                            <select id="map-selector" class="w-full p-2 border rounded">
                                <option value="1">新手村 (简单)</option>
                                <option value="2">野外 (中等)</option>
                            </select>
                        </div>
                        
                        <!-- 怪物信息 -->
                        <div class="combat-monster-info mb-3 p-3 bg-secondary/5 rounded">
                            <div class="flex items-center justify-between mb-2">
                                <h4 class="font-semibold" id="combat-monster-name">-</h4>
                                <span class="text-sm" id="combat-monster-level">-</span>
                                <span class="text-xs px-2 py-1 rounded bg-blue-100 text-blue-800" id="combat-monster-type">-</span>
                            </div>
                            <div class="grid grid-cols-2 gap-2 text-sm">
                                <div>生命值: <span id="combat-monster-health">-</span></div>
                                <div>攻击力: <span id="combat-monster-attack">-</span></div>
                                <div>防御力: <span id="combat-monster-defense">-</span></div>
                                <div>速度: <span id="combat-monster-speed">-</span></div>
                            </div>
                            <div class="mt-2">
                                <div class="w-full bg-gray-200 rounded-full h-2">
                                    <div id="combat-monster-health-bar" class="bg-red-600 h-2 rounded-full" style="width: 100%"></div>
                                </div>
                            </div>
                        </div>
                        
                        <!-- 战斗按钮 -->
                        <div class="flex gap-2 mb-3">
                            <button id="fight-once-btn" class="flex-1 btn btn-primary">
                                <i class="fa fa-fist-raised mr-1"></i> 战斗一次
                            </button>
                            <button id="fight-50-btn" class="flex-1 btn btn-accent">
                                <i class="fa fa-fist-raised mr-1"></i> 战斗50次
                            </button>
                            <button id="fight-100-btn" class="flex-1 btn btn-accent">
                                <i class="fa fa-fist-raised mr-1"></i> 战斗100次
                            </button>
                        </div>
                        
                        <!-- 战斗日志 -->
                        <div class="combat-log">
                            <h4 class="font-semibold mb-2">战斗日志</h4>
                            <div id="combat-log-container" class="combat-log-container p-2 bg-black/10 rounded text-sm max-h-40 overflow-y-auto">
                                <p class="text-secondary italic">暂无战斗记录</p>
                            </div>
                        </div>
                    </div>
                    
                    <!-- 新增标签页区域 -->
                    <div class="tabs-section">
                        <div class="flex gap-2 mb-3 border-b">
                            <button class="btn btn-secondary btn-sm" onclick="switchTab('attributes')">属性</button>
                            <button class="btn btn-secondary btn-sm" onclick="switchTab('skills')">技能</button>
                            <button class="btn btn-secondary btn-sm" onclick="switchTab('inventory')">背包</button>
                            <button class="btn btn-secondary btn-sm" onclick="switchTab('quests')">任务</button>
                        </div>
                        <div id="tab-attributes" class="tab-pane">
                            <div class="attributes">
                                <div class="attribute"><span>自由属性点</span><span id="attributePoints">0</span></div>
                                <div class="attribute">
                                    <span>生命值</span>
                                    <div>
                                        <span id="playerHealth">100</span>
                                        <button class="btn btn-secondary btn-xs ml-2" data-attr="health">+</button>
                                    </div>
                                </div>
                                <div class="attribute">
                                    <span>法力值</span>
                                    <div>
                                        <span id="playerMana">100</span>
                                        <button class="btn btn-secondary btn-xs ml-2" data-attr="mana">+</button>
                                    </div>
                                </div>
                                <div class="attribute">
                                    <span>攻击力</span>
                                    <div>
                                        <span id="playerAttack">10</span>
                                        <button class="btn btn-secondary btn-xs ml-2" data-attr="attack">+</button>
                                    </div>
                                </div>
                                <div class="attribute">
                                    <span>防御力</span>
                                    <div>
                                        <span id="playerDefense">5</span>
                                        <button class="btn btn-secondary btn-xs ml-2" data-attr="defense">+</button>
                                    </div>
                                </div>
                                <div class="attribute">
                                    <span>速度</span>
                                    <div>
                                        <span id="playerSpeed">10</span>
                                        <button class="btn btn-secondary btn-xs ml-2" data-attr="speed">+</button>
                                    </div>
                                </div>
                                
                                <!-- 新增：显示属性来源详情 -->
                                <div class="attribute-details mt-4 p-3 bg-gray-50 rounded">
                                    <h4 class="font-semibold text-sm mb-2">属性详情:</h4>
                                    <div class="text-xs space-y-1">
                                        <div>基础攻击: <span id="baseAttack">10</span></div>
                                        <div class="ml-2">装备加成: +<span id="equipmentAttackBonus">0</span></div>
                                        <div class="ml-2">技能加成: +<span id="skillAttackBonus">0</span></div>
                                        <div class="border-t pt-1 mt-1">总攻击力: <span id="totalAttack">10</span></div>
                                    </div>
                                    <div class="text-xs space-y-1 mt-2">
                                        <div>基础防御: <span id="baseDefense">5</span></div>
                                        <div class="ml-2">装备加成: +<span id="equipmentDefenseBonus">0</span></div>
                                        <div class="ml-2">技能加成: +<span id="skillDefenseBonus">0</span></div>
                                        <div class="border-t pt-1 mt-1">总防御力: <span id="totalDefense">5</span></div>
                                    </div>
                                    <div class="text-xs space-y-1 mt-2">
                                        <div>基础生命: <span id="baseHealth">100</span></div>
                                        <div class="ml-2">装备加成: +<span id="equipmentHealthBonus">0</span></div>
                                        <div class="ml-2">技能加成: +<span id="skillHealthBonus">0</span></div>
                                        <div class="border-t pt-1 mt-1">总生命值: <span id="totalHealth">100</span></div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div id="tab-skills" class="tab-pane hidden"><div id="skillsList" class="skills-list"></div></div>
                        <div id="tab-inventory" class="tab-pane hidden"><div id="inventoryGrid" class="inventory-grid"></div></div>
                        <div id="tab-quests" class="tab-pane hidden"><div id="questsList" class="quest-list"></div></div>
                    </div>
                </div>
            </aside>
        </main>
    </div>
    <div id="toast" class="toast hidden"><span id="toastMessage"></span></div>
    <div id="loading" class="loading hidden"><div class="spinner"></div><span>加载中...</span></div>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/game.js"></script>
    <script src="js/utils.js"></script>
    <script type="module">
        import { mountCultivateGlobals } from './js/modules/cultivate/index.js';
        import { mountCombatGlobals } from './js/modules/combat/index.js';

        mountCultivateGlobals();
        mountCombatGlobals();
    </script>
    <script>
        function switchTab(key){
            ['attributes','skills','inventory','quests'].forEach(k=>{
                const el=document.getElementById('tab-'+k);
                if(el){ el.classList.toggle('hidden', k!==key); }
            });
        }
        switchTab('attributes');
        
        document.addEventListener('DOMContentLoaded', async()=>{
            if(window.initGameManager){ await window.initGameManager(); }
            if(window.authManager){ await window.authManager.loadGameData(); }
            const attrs = document.querySelectorAll('button[data-attr]');
            const showLegacyToast = (message, type) => {
                if (window.authManager?.showToast) {
                    window.authManager.showToast(message, type);
                    return;
                }
                if (window.gameManager?.showToast) {
                    window.gameManager.showToast(message, type);
                }
            };
            attrs.forEach(btn=>{
                btn.addEventListener('click', async()=>{
                    const key = btn.getAttribute('data-attr');
                    const payload = {}; payload[key] = 1;
                    try {
                        const res = await gameAPI.allocateAttributes(payload);
                        if(!res || !res.success) throw new Error(res?.message||'加点失败');
                        await window.authManager.loadPlayerProfile();
                        showLegacyToast('加点成功','success');
                    } catch(err){ showLegacyToast('加点失败: '+err.message,'error'); throw err; }
                });
            });
            
            if (window.initCombatModule) {
                window.initCombatModule();
            }
        });
    </script>
</body>
</html>
