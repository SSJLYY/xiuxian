# 服务器配置
server.port=8081
server.address=0.0.0.0
server.servlet.context-path=/
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# 数据库配置
spring.datasource.url=jdbc:mysql://47.103.87.55:3306/xiuxian_game?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password="vA8!zLd2#pFqR6$sXkNg9@bYwTmC3*eH"

# MyBatis-Plus配置
mybatis-plus.mapper-locations=classpath:mapper/*.xml
mybatis-plus.type-aliases-package=com.xiuxian.game.entity
mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl
mybatis-plus.global-config.db-config.id-type=auto
mybatis-plus.global-config.db-config.logic-delete-field=deleted
mybatis-plus.global-config.db-config.logic-delete-value=1
mybatis-plus.global-config.db-config.logic-not-delete-value=0

# 数据库连接池配置（HikariCP）
spring.datasource.hikari.connection-timeout=60000
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.pool-name=XiuxianGameHikariCP

# JWT配置
jwt.secret=xiuxianGameSecretKey2024VeryLongAndSecure
jwt.expiration=86400000

# Log4j2日志配置
logging.config=classpath:log4j2-spring.xml
# 指定日志文件目录
logging.file.path=logs

# 文件上传配置
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.servlet.multipart.enabled=true

# 静态资源配置
spring.web.resources.static-locations=classpath:/static/,classpath:/public/,classpath:/META-INF/resources/
spring.web.resources.add-mappings=true
spring.web.resources.cache.period=3600

# CORS跨域配置
app.cors.allowed-origins=*
app.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
app.cors.allowed-headers=*
app.cors.allow-credentials=true

# 功能开关：所有模块启用（已迁移到MyBatis Plus）
app.features.skills.enabled=true
app.features.inventory.enabled=true
app.features.quests.enabled=true
app.features.equipment.enabled=true
app.features.shop.enabled=true
app.features.offline.enabled=true
app.features.player-query.enabled=true

# 游戏配置
app.game.max-level=9999
app.game.max-offline-hours=24
app.game.cultivation.base-exp=10
app.game.cultivation.max-time-hours=24
app.game.battle.max-batch-size=100

# 管理员配置
spring.security.user.name=admin
spring.security.user.password=password

# 性能监控配置
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.metrics.export.simple.enabled=true
