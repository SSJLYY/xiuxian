# \u670D\u52A1\u5668\u914D\u7F6E
server.port=8082
server.address=0.0.0.0
server.servlet.context-path=/
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# \u6570\u636E\u5E93\u914D\u7F6E
spring.datasource.url=jdbc:mysql://192.168.215.110:3306/xiuxian_game?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:Qq123456}

# MyBatis-Plus\u914D\u7F6E
mybatis-plus.mapper-locations=classpath:mapper/*.xml
mybatis-plus.type-aliases-package=com.xiuxian.game.modules
mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.slf4j.Slf4jImpl
mybatis-plus.configuration.default-statement-timeout=30000
mybatis-plus.global-config.db-config.id-type=auto

# \u6570\u636E\u5E93\u8FDE\u63A5\u6C60\u914D\u7F6E\uFF08HikariCP\uFF09- \u9002\u914D2H4G\u73AF\u5883\u4F18\u5316
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=3
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.pool-name=XiuxianGameHikariCP
spring.datasource.hikari.metrics-tracker-class-name=com.zaxxer.hikari.metrics.micrometer.MicrometerMetricsTracker
spring.datasource.hikari.metrics-prefix=hikaricp

# JWT\u914D\u7F6E
jwt.secret=${JWT_SECRET:xiuxianGameSecretKey2024VeryLongAndSecure}
jwt.expiration=7200000

# Log4j2\u65E5\u5FD7\u914D\u7F6E
logging.config=classpath:log4j2-spring.xml
# \u6307\u5B9A\u65E5\u5FD7\u6587\u4EF6\u76EE\u5F55
logging.file.path=logs

# \u6587\u4EF6\u4E0A\u4F20\u914D\u7F6E
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.servlet.multipart.enabled=true

# \u9759\u6001\u8D44\u6E90\u914D\u7F6E
spring.web.resources.static-locations=classpath:/static/,classpath:/public/,classpath:/META-INF/resources/
spring.web.resources.add-mappings=true
spring.web.resources.cache.period=3600

# CORS\u8DE8\u57DF\u914D\u7F6E
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}
app.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
app.cors.allowed-headers=*
app.cors.allow-credentials=false

# \u7BA1\u7406\u5458\u914D\u7F6E\uFF08\u5BC6\u7801\u4E3A BCrypt \u54C8\u5E0C\u503C\uFF0C\u539F\u59CB\u5BC6\u7801: admin123\uFF09
# \u4E0E DataInitializer.ensureAdminUser() \u4FDD\u6301\u4E00\u81F4\uFF0C\u4E24\u5904\u5BC6\u7801\u5FC5\u987B\u76F8\u540C
# \u751F\u4EA7\u73AF\u5883\u5EFA\u8BAE\u901A\u8FC7\u73AF\u5883\u53D8\u91CF ADMIN_DEFAULT_PASSWORD \u6CE8\u5165\uFF0C\u907F\u514D\u786C\u7F16\u7801
admin.default.username=${ADMIN_DEFAULT_USERNAME:admin}
admin.default.password=${ADMIN_DEFAULT_PASSWORD:admin123}
admin.default.email=${ADMIN_DEFAULT_EMAIL:admin@xiuxian.com}

# \u529F\u80FD\u5F00\u5173\uFF1A\u6240\u6709\u6A21\u5757\u542F\u7528\uFF08\u5DF2\u8FC1\u79FB\u5230MyBatis Plus\uFF09
app.features.skills.enabled=true
app.features.inventory.enabled=true
app.features.quests.enabled=true
app.features.equipment.enabled=true
app.features.shop.enabled=true
app.features.offline.enabled=true
app.features.player-query.enabled=true

# \u914D\u7F6E
app.game.max-level=9999
app.game.max-offline-hours=24
app.game.cultivation.base-exp=10
app.game.cultivation.max-time-hours=24
app.game.battle.max-batch-size=100

# \u7BA1\u7406\u5458\u914D\u7F6E\uFF08\u5BC6\u7801\u4E3A BCrypt \u54C8\u5E0C\u503C\uFF0C\u539F\u59CB\u5BC6\u7801: admin123\uFF09
# \u4E0E DataInitializer.ensureAdminUser() \u4FDD\u6301\u4E00\u81F4\uFF0C\u4E24\u5904\u5BC6\u7801\u5FC5\u987B\u76F8\u540C
# \u751F\u4EA7\u73AF\u5883\u5EFA\u8BAE\u901A\u8FC7\u73AF\u5883\u53D8\u91CF ADMIN_PASSWORD \u6CE8\u5165\uFF0C\u907F\u514D\u786C\u7F16\u7801
spring.security.user.name=admin
spring.security.user.password=$2b$10$dd5hCl9Jc05iS4T05pNDPe4Dx3l8Vhnz4l3u/bJ1I0G9nFZs//F7C
spring.security.user.roles=ADMIN

# \u6027\u80FD\u76D1\u63A7\u914D\u7F6E
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when-authorized
management.metrics.export.simple.enabled=true
management.metrics.enable.jvm=true
management.metrics.enable.process=true
management.metrics.enable.system=true
management.metrics.tags.application=xiuxian-game

# ==================== \u9636\u6BB5\u4E00\uFF1A\u57FA\u7840\u8BBE\u65BD\u5347\u7EA7\u914D\u7F6E ====================

# Redis \u914D\u7F6E - \u9002\u914D2H4G\u73AF\u5883\u4F18\u5316
spring.redis.host=192.168.215.110
spring.redis.port=6379
spring.redis.password=${REDIS_PASSWORD:}
spring.redis.database=0
spring.redis.timeout=5000ms
spring.redis.lettuce.pool.max-active=15
spring.redis.lettuce.pool.max-idle=8
spring.redis.lettuce.pool.min-idle=3
spring.redis.lettuce.pool.max-wait=5000ms
spring.redis.lettuce.pool.time-between-eviction-runs=30000

# Sentinel \u914D\u7F6E
spring.sentinel.enabled=true
spring.sentinel.eager=true
spring.sentinel.transport.dashboard=127.0.0.1:8080

# \u8BFB\u5199\u5206\u79BB\u5F00\u5173\uFF08\u9ED8\u8BA4\u5173\u95ED\uFF0C\u9700\u8981\u914D\u7F6E\u4E3B\u4ECE\u540E\u542F\u7528\uFF09
spring.datasource.readwrite.enabled=false
# \u4E3B\u5E93\u914D\u7F6E
spring.datasource.master.url=jdbc:mysql://192.168.215.110:3306/xiuxian_game?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
spring.datasource.master.username=root
spring.datasource.master.password=${DB_MASTER_PASSWORD:devDefaultPassword}
spring.datasource.master.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.master.hikari.maximum-pool-size=20
# \u4ECE\u5E93\u914D\u7F6E
spring.datasource.slave.url=jdbc:mysql://192.168.215.110:3307/xiuxian_game?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
spring.datasource.slave.username=root
spring.datasource.slave.password=${DB_SLAVE_PASSWORD:devDefaultPassword}
spring.datasource.slave.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.slave.hikari.maximum-pool-size=30

# \u7F13\u5B58\u914D\u7F6E - TTL\u4F18\u5316\uFF08\u57FA\u4E8E\u5B9E\u9645\u4E1A\u52A1\uFF09
spring.cache.type=redis
spring.cache.redis.time-to-live=10800000
spring.cache.redis.cache-null-values=false

# \u6218\u6597\u964D\u7EA7\u914D\u7F6E
combat.drop.rate.multiplier=1.0
combat.fallback.enabled=false

# ==================== \u6027\u80FD\u548C\u5B89\u5168\u4F18\u5316 ====================
# HTTP \u538B\u7F29\u914D\u7F6E
server.compression.enabled=true
server.compression.min-response-size=1024
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json,application/xml
