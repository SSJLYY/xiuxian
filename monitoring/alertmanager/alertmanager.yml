route:
  receiver: 'slack-notifications'
  group_by: ['alertname', 'severity']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  
  routes:
    - match:
        severity: critical
      receiver: 'slack-critical'
      continue: true
    - match:
        severity: warning
      receiver: 'slack-warning'

receivers:
  - name: 'slack-notifications'
    slack_configs:
      - api_url: 'SLACK_WEBHOOK_URL'
        send_resolved: true
        channel: '#alerts'
        title: '{{ template "slack.default.title" . }}'
        text: '{{ template "slack.default.text" . }}'
        icon_emoji: ':warning:'
  
  - name: 'slack-critical'
    slack_configs:
      - api_url: 'SLACK_WEBHOOK_URL'
        send_resolved: true
        channel: '#critical-alerts'
        icon_emoji: ':rotating_light:'
        actions:
          - type: button
            text: 'Runbook :green_book:'
            url: 'http://wiki.internal/runbook'
          - type: button
            text: 'Silence :no_bell:'
            url: '{{ .SilenceURL }}'
  
  - name: 'slack-warning'
    slack_configs:
      - api_url: 'SLACK_WEBHOOK_URL'
        send_resolved: true
        channel: '#warnings'
        icon_emoji: ':warning:'

# 告警抑制规则
inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'instance']
