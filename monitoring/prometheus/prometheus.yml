global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'xiuxian-game'
    static_configs:
      - targets: ['xiuxian-game:8081']
    metrics_path: '/actuator/prometheus'
    
    # 重试配置
    scrape_interval: 10s
    scrape_timeout: 5s
    
    # 指标重命名
    metric_relabel_configs:
      - source_labels: [application]
        target_label: service
        replacement: xiuxian-game

  - job_name: 'mysql'
    static_configs:
      - targets: ['mysqld-exporter:9104']
    scrape_interval: 30s

  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']
    scrape_interval: 30s

# 告警规则
rule_files:
  - "alerts.yml"

# Alertmanager 配置
alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093
