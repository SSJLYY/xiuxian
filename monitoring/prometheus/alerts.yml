groups:
  - name: xiuxian_game_alerts
    interval: 30s
    rules:
      # 服务宕机告警
      - alert: XiuxianGameDown
        expr: up{job="xiuxian-game"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Xiuxian Game 服务宕机"
          description: "Xiuxian Game 实例 {{ $labels.instance }} 已经宕机超过 1 分钟"
      
      # CPU 使用率过高告警
      - alert: HighCPUUsage
        expr: process_cpu_seconds_total{job="xiuxian-game"} > 0.8
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "CPU 使用率过高"
          description: "Xiuxian Game CPU 使用率超过 80%，当前值：{{ $value }}"
      
      # 内存泄漏检测
      - alert: MemoryLeak
        expr: jvm_memory_bytes_used{area="heap"} / jvm_memory_bytes_max{area="heap"} > 0.9
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "可能的内存泄漏"
          description: "JVM 堆内存使用率超过 90%"
      
      # 数据库连接池耗尽
      - alert: DatabaseConnectionPoolExhausted
        expr: HikariCP_active_connections / HikariCP_max_connections > 0.9
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "数据库连接池接近耗尽"
          description: "HikariCP 连接池使用率超过 90%"
      
      # 错误率过高
      - alert: HighErrorRate
        expr: rate(http_server_requests_seconds_count{status=~"5.."}[5m]) / rate(http_server_requests_seconds_count[5m]) > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "HTTP 错误率过高"
          description: "5xx 错误率超过 5%"
      
      # Redis 连接失败
      - alert: RedisConnectionFailed
        expr: redis_connected_clients == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Redis 连接失败"
          description: "无法连接到 Redis 服务"
      
      # MySQL 连接失败
      - alert: MySQLConnectionFailed
        expr: mysql_up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "MySQL 连接失败"
          description: "无法连接到 MySQL 数据库"
      
      # 响应时间过长
      - alert: SlowResponseTime
        expr: histogram_quantile(0.95, rate(http_server_requests_seconds_bucket{job="xiuxian-game"}[5m])) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "响应时间过长"
          description: "95% 的请求响应时间超过 2 秒"
      
      # 离线下线收益异常
      - alert: OfflineExpAnomaly
        expr: rate(player_offline_exp_total[1h]) > 10000
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "离线收益异常"
          description: "离线经验获取速率异常，可能存在刷分行为"
